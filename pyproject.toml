[project]
name = "plc"
version = "0.1.0"
description = "Multi-agent explainable match intelligence from synthetic football events"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-foundry",
    "agent-framework-orchestrations",
    "azure-identity",
    "python-dotenv",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
foundry = ["azure-ai-projects"]  # hosted agents in Foundry Agent Service (`python -m plc publish`)
eval = ["azure-ai-evaluation"]  # Foundry evaluators for `python -m plc evaluate`; not needed offline

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plc"]
